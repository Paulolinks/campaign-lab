# Production on the VPS, behind the Traefik that already runs there (same pattern as the publisher app).
# Own database and volumes: never shares data with the other apps.
#
#   docker compose -f compose.traefik.yaml -p campaign-lab up -d --build
#
# Variables in the server's env file (created by scripts/vps-setup-env.sh):
# APP_HOST, POSTGRES_PASSWORD, BETTER_AUTH_SECRET, BETTER_AUTH_URL, TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER, MAX_UPLOAD_MB.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaignlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: campaignlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaignlab"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: campaign-lab:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://campaignlab:${POSTGRES_PASSWORD}@postgres:5432/campaignlab
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?defina TRAEFIK_NETWORK}
      traefik.http.services.campaign-lab.loadbalancer.server.port: "3000"
      traefik.http.routers.campaign-lab.rule: Host(`${APP_HOST:?defina APP_HOST}`)
      traefik.http.routers.campaign-lab.entrypoints: websecure
      traefik.http.routers.campaign-lab.tls: "true"
      traefik.http.routers.campaign-lab.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?defina TRAEFIK_CERTRESOLVER}

  # Daily compressed dump of the database, kept for 14 days in /opt/campaign-lab/backups.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        f=/backups/campaignlab-$$(date +%Y%m%d-%H%M).sql.gz;
        pg_dump -h postgres -U campaignlab campaignlab | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup ok $$f";
        find /backups -name "campaignlab-*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Meta read-only sync (spec 04, ADR-0003): leads every 5 minutes, numbers every 3 hours.
  # Calls the app on the internal network; the key is derived from BETTER_AUTH_SECRET (src/lib/meta-sync-key.ts).
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    entrypoint: >
      sh -c 'KEY=$$(printf "%s" "$$BETTER_AUTH_SECRET:meta-sync" | sha256sum | cut -d" " -f1);
      call() { wget -q -T 30 -O /dev/null --header "x-sync-key: $$KEY" --post-data "" "http://app:3000/api/internal/meta-sync?job=$$1" || echo "meta-sync $$1 falhou"; };
      sleep 120; n=0;
      while true; do
        if [ $$((n % 36)) -eq 0 ]; then call metrics; sleep 60; fi;
        call leads; n=$$((n + 1)); sleep 300;
      done'
    depends_on: [app]
    networks: [internal]

volumes:
  pgdata:
  media:

networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
